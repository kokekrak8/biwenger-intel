# Copia este archivo a config.ini y rellena tus datos.
# NO subas config.ini a ningún sitio: contiene tu contraseña.

[biwenger]
email = tu_email
password = tu_contraseña

# Recomendado: fíjalos para no depender de la autodetección.
# Los ves en DevTools -> Network -> cabeceras X-League / X-User / X-Version
# de cualquier petición a biwenger.as.com al pulsar "Inicio".
league_id =
user_id =
x_version =

# Presupuesto inicial por defecto de tu liga (ajústalo al de la tuya):
presupuesto_inicial = 40000000
# Margen extra sobre la puja máxima (0 = fórmula estándar saldo + valor/4):
overdraft = 0
# Páginas del historial a bajar en la 1ª ejecución (para reconstruir la temporada):
paginas_historico = 40
# Intervalo de sondeo en segundos (300 = 5 min). No bajes de ~120.
intervalo = 300
db = biwenger.db

# (Opcional) Presupuesto inicial distinto para managers concretos.
# La clave es el user_id que verás en la primera ejecución.
[presupuestos]
# 12345 = 45000000

# (Opcional) Avisos por Telegram cuando cambie el dinero de un rival.
[telegram]
token =
chat_id =
